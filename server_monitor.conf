# Server Monitoring Configuration to be placed as /etc/server_monitor.conf

ADMIN_EMAIL="admin@example.com"         # Email for alerts
LOG_FILE="/var/log/server_monitor.log"  # Log file path
ALERT_SUBJECT="Server Alert"            # Email subject

THRESHOLD_CPU=80                        # CPU usage threshold (%)
THRESHOLD_FAILED_LOGINS=5               # Failed login attempts threshold
THRESHOLD_NETWORK_CONNECTIONS=100       # Established connections threshold
THRESHOLD_DISK=90                       # Disk usage threshold (%)
THRESHOLD_MEMORY=80                     # Memory usage threshold (%)
THRESHOLD_PROCESSES=500                 # Process count threshold

CRITICAL_DIR="/etc"                     # Directory to monitor
SNAPSHOT_FILE="/var/lib/server_monitor/etc_snapshot.md5"  # MD5 snapshot
